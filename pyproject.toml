[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aris-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "click>=8.1.0",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.0",
    "numpy<2.0.0",
    "inquirer>=3.0.0",
    "opencv-python>=4.11.0.86",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.8",
    "debugpy>=1.8.20",
]

[project.scripts]
aris = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
